name: zant-v0-12-ci
on: [push, pull_request]
jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall src scripts
      - run: python scripts/validate_v1_2_repository.py
      - run: python scripts/run_v1_2_stdlib_tests.py
