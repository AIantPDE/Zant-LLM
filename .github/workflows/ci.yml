name: zant-llm-v0-1-ci
on:
  pull_request:
  push:
    branches:
      - v0.1-explanation-preview-baseline
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_v0_1_repository.py
      - run: python -m pytest -q
      - run: python scripts/train_v0_1_baseline.py
      - run: python scripts/eval_v0_1_baseline.py
      - run: python scripts/make_v0_1_release_manifest.py
