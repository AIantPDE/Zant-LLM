name: v1.4R-ci
on: [push, pull_request]
jobs:
  stdlib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall src scripts
      - run: python scripts/run_v1_4R_stdlib_tests.py
