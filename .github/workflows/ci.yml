name: v1.5-stdlib-ci
on:
  push:
  pull_request:
jobs:
  stdlib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall .\src .\scripts
      - run: python .\scriptsun_v1_5_stdlib_tests.py
