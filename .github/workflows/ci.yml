name: zant-llm-v0-5-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall .\src .\scripts
      - run: python .\scripts\run_v0_5_stdlib_tests.py
