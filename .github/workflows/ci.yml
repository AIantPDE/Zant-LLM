name: zant-llm-v1-6-ci

on:
  push:
  pull_request:

jobs:
  stdlib-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify repository
        run: python scripts/validate_v1_6_repository.py
      - name: Run stdlib tests
        run: python scripts/run_v1_6_stdlib_tests.py
      - name: Build observability dashboard
        run: python scripts/build_v1_6_runtime_observability.py
