name: zant-llm-v0-11-ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\RUN_V0_11_ALL_LOCAL.ps1
