name: ci
on: [push, pull_request]
jobs:
  v0_4_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/validate_v0_4_repository.py
      - run: python -m compileall src scripts
      - run: PYTHONPATH=src python scripts/run_v0_4_stdlib_tests.py
