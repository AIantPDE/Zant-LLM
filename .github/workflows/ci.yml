name: zant-v0-7-ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/validate_v0_7_repository.py
      - run: python scripts/run_v0_7_stdlib_tests.py
